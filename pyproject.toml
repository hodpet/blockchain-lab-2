[project]
name = "crypto-lab"
version = "1.0.0"
description = "secp256k1, ECDSA, HD wallets and post-quantum analysis (Lab 02)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Only for Keccak-256. Python's hashlib ships SHA3-256, which is a DIFFERENT
    # function (different padding rule) and gives the wrong Ethereum addresses.
    # Every other primitive in this lab is implemented from scratch.
    "pycryptodome>=3.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

# Application, not a distributable library. See the note in ../README.md about
# editable installs and non-ASCII paths on Windows.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
